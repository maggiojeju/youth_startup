<script>
/* ── 저장소 어댑터: Firebase → 기기 저장 → 임시 저장 순서로 자동 선택 ── */
(function () {
  var mode = "memory";
  var mem = {};
  var db = null;
  try {
    if (typeof firebase !== "undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      mode = "firebase";
    } else if (typeof firebase === "undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
      console.warn("Firebase 스크립트가 로드되지 않았습니다(네트워크 차단 가능). 기기 저장으로 전환합니다.");
    }
  } catch (e) { console.warn("Firebase 초기화 실패 — 기기 저장으로 전환:", e); db = null; }
  if (!db) {
    try { localStorage.setItem("__probe", "1"); localStorage.removeItem("__probe"); mode = "local"; }
    catch (e) { mode = "memory"; }
  }
  var P = function (k) { return "rooms/" + ROOM_ID + "/" + k; };
  window.STORAGE_MODE = mode;

  /* 연결 확인: 5초 안에 응답이 없으면 기기 저장으로 자동 전환
     (미리보기 등 외부 통신이 막힌 환경에서 무한 대기 방지) */
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) {
      setTimeout(function () { rej(new Error("연결 시간 초과")); }, ms);
    })]);
  }
  function fallbackLocal() {
    db = null;
    try { localStorage.setItem("__probe", "1"); localStorage.removeItem("__probe"); mode = "local"; }
    catch (e) { mode = "memory"; }
    window.STORAGE_MODE = mode;
  }
  var ready = (function () {
    if (!db) return Promise.resolve();
    return withTimeout(db.ref(P("__ping")).once("value"), 5000)
      .then(function () { window.STORAGE_MODE = "firebase"; })
      .catch(function (e) {
        console.warn("Firebase에 연결할 수 없어 기기 저장으로 전환합니다:", e && e.message);
        fallbackLocal();
      });
  })();

  /* 경로 하나만 골라 값을 넣습니다 (다른 사람이 쓴 부분은 건드리지 않음) */
  function localMerge(obj, path, value) {
    var parts = path.split("/"), cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    if (value === null) delete cur[parts[parts.length - 1]];
    else cur[parts[parts.length - 1]] = value;
  }

  window.storage = {
    /* 바뀐 항목만 저장 — 같은 팀의 다른 기기가 쓴 내용을 덮어쓰지 않습니다 */
    update: async function (key, patch) {
      await ready;
      if (db) { await withTimeout(db.ref(P(key)).update(patch), 8000); return { key: key }; }
      var raw = mode === "local" ? localStorage.getItem(P(key)) : mem[P(key)];
      var obj = {};
      try { obj = raw ? (typeof raw === "string" ? JSON.parse(raw) : raw) : {}; } catch (e) { obj = {}; }
      Object.keys(patch).forEach(function (pth) { localMerge(obj, pth, patch[pth]); });
      var out = JSON.stringify(obj);
      if (mode === "local") localStorage.setItem(P(key), out); else mem[P(key)] = out;
      return { key: key };
    },
    /* 같은 팀 기록이 바뀌면 알려줍니다 (Firebase 연결 시에만 동작) */
    subscribe: function (key, cb) {
      var off = function () {};
      ready.then(function () {
        if (!db) return;
        var ref = db.ref(P(key));
        var handler = ref.on("value", function (snap) { cb(snap.val()); });
        off = function () { ref.off("value", handler); };
      });
      return function () { off(); };
    },
    get: async function (key) {
      await ready;
      if (db) {
        var snap = await withTimeout(db.ref(P(key)).once("value"), 8000);
        if (snap.val() == null) throw new Error("not found");
        return { value: snap.val() };
      }
      var v = mode === "local" ? localStorage.getItem(P(key)) : (P(key) in mem ? mem[P(key)] : null);
      if (v == null) throw new Error("not found");
      return { value: v };
    },
    set: async function (key, value) {
      await ready;
      if (db) { await withTimeout(db.ref(P(key)).set(value), 8000); }
      else {
        var out = typeof value === "string" ? value : JSON.stringify(value);
        if (mode === "local") localStorage.setItem(P(key), out); else mem[P(key)] = out;
      }
      return { key: key };
    },
    delete: async function (key) {
      await ready;
      if (db) { await withTimeout(db.ref(P(key)).remove(), 8000); }
      else if (mode === "local") { localStorage.removeItem(P(key)); }
      else { delete mem[P(key)]; }
      return { key: key };
    }
  };
})();
</script>

async function sGet(key) {
  try {
    const r = await window.storage.get(key, true);
    if (!r) return null;
    return typeof r.value === "string" ? JSON.parse(r.value) : r.value;
  } catch {
    return null;
  }
}
async function sSet(key, obj) {
  try {
    await window.storage.set(key, obj, true);
    return true;
  } catch {
    return false;
  }
}
async function sPatch(key, patch) {
  try {
    await window.storage.update(key, patch);
    return true;
  } catch {
    return false;
  }
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const SYNC_BRANCHES = ["stamps", "answers", "checks", "roles", "retro"];
const ITEM_BRANCHES = ["reviews", "prompts"];
const clone = o => JSON.parse(JSON.stringify(o == null ? null : o));

/* 저장된 값(예전 배열 / 새 방식 객체) → 화면용 배열 */
const toList = v => !v ? [] : Array.isArray(v)
  ? v.filter(Boolean).map((x, i) => ({ ...x, _id: x._id || `old${i}` }))
  : Object.keys(v).map(k => ({ ...v[k], _id: k }));

function normalizeProgress(raw) {
  const p = raw || {};
  return {
    stamps: p.stamps || {}, answers: p.answers || {}, checks: p.checks || {},
    roles: p.roles || {}, retro: p.retro || {},
    reviews: toList(p.reviews), prompts: toList(p.prompts),
    pw: p.pw || null, updatedAt: p.updatedAt || null
  };
}

/* 이전 저장 시점과 지금을 비교해 바뀐 항목만 골라냅니다 */
function collectDiff(base, next) {
  const out = {};
  const walk = (a, b, prefix) => {
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
    keys.forEach(k => {
      const av = (a || {})[k], bv = (b || {})[k];
      if (bv && typeof bv === "object" && !Array.isArray(bv)) walk(av || {}, bv, prefix + k + "/");
      else if (JSON.stringify(av) !== JSON.stringify(bv)) out[prefix + k] = bv === undefined ? null : bv;
    });
  };
  SYNC_BRANCHES.forEach(br => walk((base || {})[br], (next || {})[br], br + "/"));
  ITEM_BRANCHES.forEach(br => {
    const had = new Set(((base || {})[br] || []).map(x => x._id));
    ((next || {})[br] || []).forEach(item => {
      if (had.has(item._id)) return;
      const body = { ...item };
      delete body._id;
      out[`${br}/${item._id}`] = body;
    });
  });
  if ((next || {}).pw && (next || {}).pw !== (base || {}).pw) out.pw = next.pw;
  return out;
}

/* 서버에서 온 내용을 화면에 합칩니다.
   내가 방금 고쳐 아직 저장되지 않은 칸은 내 것을 지킵니다. */
function mergeRemote(local, remote, base) {
  const out = { ...local };
  const mergeTree = (lo, re, ba) => {
    const res = {};
    const keys = new Set([...Object.keys(lo || {}), ...Object.keys(re || {}), ...Object.keys(ba || {})]);
    keys.forEach(k => {
      const lv = (lo || {})[k], rv = (re || {})[k], bv = (ba || {})[k];
