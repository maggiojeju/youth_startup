<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프롬프트 생성기 — AI디어 주식회사</title>
<style>
  :root{
    --bg:#F5F7FB; --card:#FFFFFF; --ink:#1F2937; --sub:#6B7280; --line:#E5E7EB;
    --primary:#274690; --primary-soft:#E8EDF9;
    --e1:#3B82F6; --e2:#10B981; --e3:#F59E0B; --e4:#8B5CF6; --e5:#EC4899;
    --e1bg:#EAF2FE; --e2bg:#E7F8F1; --e3bg:#FEF3E0; --e4bg:#F1EAFE; --e5bg:#FDEAF4;
    --warn:#FFF7DF; --warnline:#F0D77B;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{font-size:17px;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    line-height:1.55; padding-bottom:150px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:16px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 2px 2px;}
  .brand{font-weight:800; font-size:1.05rem; color:var(--primary); letter-spacing:-.01em;}
  .brand small{display:block; font-weight:600; font-size:.72rem; color:var(--sub); letter-spacing:0;}
  .gear{border:1px solid var(--line); background:var(--card); border-radius:12px; padding:8px 12px; font-size:.85rem; color:var(--sub); cursor:pointer;}
  .gear:hover{color:var(--ink);}
  /* step dots */
  .steps{display:flex; gap:6px; align-items:center; margin:14px 0 10px;}
  .dot{flex:1; height:8px; border-radius:99px; background:#DFE5F0; position:relative; transition:background .25s;}
  .dot.on{background:var(--primary);}
  .stepnum{font-size:.78rem; color:var(--sub); font-weight:700; white-space:nowrap;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-top:10px; box-shadow:0 1px 3px rgba(20,30,60,.04);}
  h1{font-size:1.3rem; margin:0 0 4px; letter-spacing:-.02em;}
  .lead{color:var(--sub); font-size:.92rem; margin:0 0 16px;}
  h2.group{font-size:.95rem; margin:20px 0 8px; display:flex; align-items:center; gap:8px;}
  h2.group:first-of-type{margin-top:4px;}
  .tag{font-size:.7rem; font-weight:800; padding:2px 8px; border-radius:99px; color:#fff;}
  .t1{background:var(--e1);} .t2{background:var(--e2);} .t3{background:var(--e3);} .t4{background:var(--e4);} .t5{background:var(--e5);}
  .hint{font-size:.8rem; color:var(--sub); margin:2px 0 8px;}
  /* choice chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; border-radius:14px;
    padding:12px 16px; font-size:.95rem; font-weight:600; cursor:pointer;
    min-height:48px; display:flex; align-items:center; transition:all .12s;
  }
  .chip:hover{border-color:#B9C4DE;}
  .chip.sel{border-color:var(--primary); background:var(--primary-soft); color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset;}
  .chip .em{font-size:1.05rem; margin-right:6px;}
  /* type cards */
  .types{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:520px){.types{grid-template-columns:1fr;}}
  .tcard{border:1.5px solid var(--line); border-radius:var(--radius); background:#fff; padding:16px; cursor:pointer; transition:all .12s; text-align:left;}
  .tcard:hover{border-color:#B9C4DE;}
  .tcard.sel{border-color:var(--primary); background:var(--primary-soft); box-shadow:0 0 0 1px var(--primary) inset;}
  .tcard .em{font-size:1.7rem;}
  .tcard .nm{font-weight:800; margin:6px 0 2px;}
  .tcard .tool{display:inline-block; font-size:.72rem; font-weight:700; color:#fff; background:#7A8BB0; border-radius:99px; padding:2px 9px; margin-top:6px;}
  .tcard.sel .tool{background:var(--primary);}
  .tcard .ds{font-size:.82rem; color:var(--sub);}
  /* inputs */
  input[type=text], textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    font:inherit; font-size:.95rem; background:#fff; color:var(--ink);
  }
  input:focus, textarea:focus, .chip:focus-visible, .tcard:focus-visible, button:focus-visible{outline:3px solid #A9C0F5; outline-offset:1px; border-color:var(--primary);}
  .req{color:#D14343; font-weight:800;}
  /* nav buttons */
  .nav{display:flex; gap:10px; margin-top:22px;}
  .btn{
    border:none; border-radius:14px; padding:14px 20px; font:inherit; font-weight:800;
    font-size:1rem; cursor:pointer; min-height:50px;
  }
  .btn.primary{background:var(--primary); color:#fff; flex:1;}
  .btn.primary:hover{background:#1E3873;}
  .btn.primary:disabled{background:#B9C4DE; cursor:not-allowed;}
  .btn.ghost{background:#fff; border:1.5px solid var(--line); color:var(--sub);}
  .btn.small{padding:9px 14px; min-height:40px; font-size:.86rem; border-radius:11px;}
  /* live prompt bar */
  #liveBar{
    position:fixed; left:0; right:0; bottom:0; background:#FFFFFFF2; backdrop-filter:blur(6px);
    border-top:1px solid var(--line); box-shadow:0 -4px 16px rgba(20,30,60,.07); z-index:40;
  }
  #liveBar .inner{max-width:760px; margin:0 auto; padding:10px 16px 12px;}
  #liveBar .bt{display:flex; justify-content:space-between; align-items:center; font-size:.78rem; font-weight:800; color:var(--sub); letter-spacing:.02em;}
  #liveBar .toggle{border:none; background:none; color:var(--primary); font-weight:800; font-size:.78rem; cursor:pointer; padding:4px;}
  #livePrompt{font-size:.92rem; margin-top:6px; max-height:96px; overflow-y:auto; line-height:1.9;}
  #livePrompt.closed{display:none;}
  .seg{border-radius:6px; padding:2px 4px; margin:0 1px; box-decoration-break:clone; -webkit-box-decoration-break:clone;}
  .s1{background:var(--e1bg); box-shadow:inset 0 -2px 0 var(--e1);}
  .s2{background:var(--e2bg); box-shadow:inset 0 -2px 0 var(--e2);}
  .s3{background:var(--e3bg); box-shadow:inset 0 -2px 0 var(--e3);}
  .s4{background:var(--e4bg); box-shadow:inset 0 -2px 0 var(--e4);}
  .s5{background:var(--e5bg); box-shadow:inset 0 -2px 0 var(--e5);}
  .empty-note{color:#9AA3B2; font-style:italic;}
  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px;}
  .lg{font-size:.75rem; font-weight:700; padding:4px 10px; border-radius:99px;}
  .lg.l1{background:var(--e1bg); color:#1D4FA8;} .lg.l2{background:var(--e2bg); color:#0B7A55;}
  .lg.l3{background:var(--e3bg); color:#A16207;} .lg.l4{background:var(--e4bg); color:#6D3FC4;}
  .lg.l5{background:var(--e5bg); color:#BE3380;}
  .bigPrompt{font-size:1.06rem; line-height:2.15; background:#FBFCFE; border:1px solid var(--line); border-radius:14px; padding:18px;}
  .missing{background:var(--warn); border:1px dashed var(--warnline); border-radius:12px; padding:10px 14px; font-size:.86rem; margin-top:10px;}
  .missing b{color:#8a6d1a;}
  /* step5 */
  .origBox{background:#F3F4F6; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:.86rem; color:#4B5563; white-space:pre-wrap;}
  .origBox .lb{font-size:.72rem; font-weight:800; color:var(--sub); display:block; margin-bottom:4px; letter-spacing:.03em;}
  textarea#editArea{min-height:150px; margin-top:12px; line-height:1.7; resize:vertical;}
  .banner{border-radius:12px; padding:11px 14px; font-size:.87rem; margin-top:10px; display:flex; gap:8px; align-items:flex-start;}
  .banner.warn{background:var(--warn); border:1px solid var(--warnline); color:#7a5d0e;}
  .banner.ok{background:#E7F8F1; border:1px solid #9ADFC3; color:#0B7A55;}
  .copyrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;}
  .followups{margin-top:8px;}
  .fu{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:8px; display:flex; justify-content:space-between; gap:10px; align-items:center; background:#fff;}
  .fu .fx{font-weight:700; font-size:.93rem;}
  .fu .fd{font-size:.78rem; color:var(--sub); margin-top:2px;}
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:120px; background:#1F2937; color:#fff;
    padding:10px 18px; border-radius:99px; font-size:.88rem; font-weight:700; opacity:0; transition:opacity .25s; z-index:60; pointer-events:none;
  }
  .toast.show{opacity:1;}
  /* teacher */
  #teacher{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:80; display:none; overflow-y:auto;}
  #teacher.open{display:block;}
  #teacher .panel{max-width:760px; margin:30px auto; background:#fff; border-radius:18px; padding:24px;}
  #teacher h3{margin:0 0 4px;}
  #teacher .grp{margin-top:16px;}
  #teacher label{font-size:.85rem; font-weight:800; display:block; margin-bottom:4px;}
  #teacher textarea{min-height:80px; font-size:.85rem; line-height:1.6;}
  #teacher .note{font-size:.78rem; color:var(--sub);}
  .footer{margin-top:26px; text-align:center; font-size:.75rem; color:#A5AFC2;}
  /* modal */
  #modal{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:90; display:none; align-items:center; justify-content:center; padding:20px;}
  #modal.open{display:flex;}
  #modal .box{background:#fff; border-radius:18px; padding:22px; max-width:380px; width:100%; box-shadow:0 10px 40px rgba(15,23,42,.25);}
  #modal .mtext{font-weight:700; font-size:.98rem; margin-bottom:14px; line-height:1.5;}
  #modal input{margin-bottom:14px;}
  #modal .mrow{display:flex; gap:8px; justify-content:flex-end;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">프롬프트 생성기<small>AI디어 주식회사 · 청소년 스타트업</small></div>
    <button class="gear" id="gearBtn" aria-label="교사 모드">⚙ 교사</button>
  </header>

  <div class="steps" id="stepDots" aria-hidden="true"></div>
  <div id="app"></div>
  <div class="footer">SW미래채움 · 프롬프트는 명령이 아니라 대화입니다</div>
</div>

<div id="liveBar" role="region" aria-label="조립 중인 프롬프트">
  <div class="inner">
    <div class="bt">
      <span>🧩 조립 중인 프롬프트</span>
      <button class="toggle" id="liveToggle">접기 ▾</button>
    </div>
    <div id="livePrompt"></div>
  </div>
</div>

<div class="toast" id="toast">복사했어요!</div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="mtext" id="mText"></div>
    <input type="text" id="mInput" style="display:none" autocomplete="off">
    <div class="mrow">
      <button class="btn ghost small" id="mCancel">취소</button>
      <button class="btn primary small" id="mOk" style="flex:0 0 auto">확인</button>
    </div>
  </div>
</div>

<div id="teacher">
  <div class="panel">
    <h3>⚙ 교사 모드 — 선택지 편집</h3>
    <p class="note">한 줄에 하나씩 적으세요. 저장하면 이 기기에서 계속 유지됩니다. (대화 이어가기 카드는 「문장틀 | 설명」 형식)</p>
    <div id="teacherBody"></div>
    <div class="nav">
      <button class="btn ghost" id="tReset">기본값으로 되돌리기</button>
      <button class="btn ghost" id="tClose">닫기</button>
      <button class="btn primary" id="tSave">저장하기</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= 기본 선택지 (교사 모드에서 편집 가능) ================= */
const DEFAULTS = {
  itemKinds: ["실물 제품","디지털 제품","서비스","콘텐츠","결합형(섞어서)"],
  posterStyle: ["밝고 산뜻한","귀여운 캐릭터풍","미래적인","손그림 느낌","사진처럼 사실적인"],
  posterColor: ["파랑 계열의 시원한","노랑 계열의 따뜻한","초록 계열의 자연스러운","알록달록 신나는"],
  posterRatio: ["세로가 긴 포스터","정사각형","가로가 긴 배너"],
  posterInclude: ["상품 이름이 들어갈 자리","상품의 모습(대표 이미지)","QR코드가 들어갈 자리","핵심 특징 문구 자리"],
  homeSections: ["상품 소개","이용 방법","가격 안내","만든 사람들(팀 소개)","고객 후기·방명록","문의하기"],
  homeMood: ["깔끔하고 정돈된","알록달록 신나는","차분하고 믿음직한"],
  homeForm: ["한 페이지에서 스크롤로 보도록","여러 개의 섹션으로 나누어"],
  appFeature: ["체크리스트","알림·안내판","퀴즈","신청·예약 폼","기록장(일지)","랜덤 뽑기","점수 계산기"],
  appScreen: ["제목과 짧은 설명","시작 버튼","입력 칸","결과 화면","완료 체크 표시"],
  appResult: ["확인한 것은 체크 표시가 되게","점수나 결과를 바로 보여주게","목록으로 정리해서 보여주게","완료 메시지가 뜨게"],
  sloganTone: ["신나는","믿음직한","재미있는(유머)","감동적인"],
  sloganLen: ["아주 짧게(10자 안팎)","한 문장으로","두 문장으로"],
  followups: [
    "○○ 부분을 ○○로 바꿔줘. | 결과에서 마음에 안 드는 곳을 콕 집어 말해요.",
    "○○이 잘 안 돼. ○○하게 고쳐줘. | 무엇이 문제인지 + 어떻게 바뀌면 좋을지 함께 말해요.",
    "글자와 버튼을 더 크게 해줘. | 보기 어렵거나 누르기 어려울 때 써요.",
    "우리 고객인 ○○에게 더 어울리게 바꿔줘. | 고객을 다시 떠올리게 하는 요청이에요."
  ]
};
const TEACHER_PIN = "2026";
const LS_KEY = "pg_options_v1";

let OPT = loadOptions();
function loadOptions(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const o = JSON.parse(raw); return Object.assign({}, JSON.parse(JSON.stringify(DEFAULTS)), o); }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function saveOptions(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }

/* ================= 상태 ================= */
const TYPES = [
  {id:"poster", em:"🖼️", nm:"홍보 포스터", tool:"Canva AI 이미지", ds:"상품을 알리는 포스터 그림"},
  {id:"homepage", em:"🏠", nm:"소개 홈페이지", tool:"Canva 웹사이트", ds:"상품을 소개하는 페이지"},
  {id:"webapp", em:"📱", nm:"기능이 있는 웹 앱", tool:"Canva Code", ds:"눌러서 작동하는 서비스"},
  {id:"slogan", em:"✏️", nm:"한 줄 홍보 문구", tool:"Magic Write", ds:"기억에 남는 홍보 문장"}
];
let S; resetState();
function resetState(){
  S = {
    step:1, type:null, itemKind:null,
    customer:"", problem:"", product:"",
    posterStyle:null, posterColor:null, posterRatio:null, posterInclude:[],
    homeSections:[], homeMood:null, homeForm:null,
    appFeature:null, appScreen:[], appSample:"", appResult:null,
    sloganTone:null, sloganLen:null, sloganWord:"",
    edited:null
  };
}

/* ================= 조사 자동 선택 ================= */
function josa(word, withBatchim, noBatchim){
  // 마지막 한글 글자를 찾아 받침 여부로 조사 결정
  for(let i=word.length-1;i>=0;i--){
    const c=word.charCodeAt(i);
    if(c>=0xAC00 && c<=0xD7A3){ return (c-0xAC00)%28>0 ? withBatchim : noBatchim; }
    if(/[0-9A-Za-z]/.test(word[i])) break; // 숫자·영어로 끝나면 병기
  }
  return withBatchim+"("+noBatchim+")";
}
const jEulReul=w=>josa(w,"을","를"), jIGa=w=>josa(w,"이","가"), jEuro=w=>josa(w,"으로","로");

/* ================= 프롬프트 조립 (세그먼트: {t:텍스트, e:요소번호}) ================= */
function segs(){
  const cus = S.customer.trim(), prb = S.problem.trim();
  const prod = S.product.trim() || "우리 상품";
  const kind = S.itemKind || "상품";
  const out = [];
  const push=(t,e)=>{ if(t) out.push({t,e}); };
  const gap=()=> out.push({t:" ", e:0});
  const cusT = cus ? cus : null, prbT = prb ? prb : null;

  if(!S.type) return out;

  if(S.type==="poster"){
    push((cusT? cusT : "(고객)")+jEulReul(cusT||"객")+" 위한",1); gap();
    push("'"+prod+"' 홍보 포스터를 그려줘.",2); gap();
    push("이 상품은 "+(prbT? prbT : "(문제)")+jEulReul(prbT||"제")+" 해결하는 "+kind+josa(kind,"이야.","야."),4); gap();
    if(S.posterStyle||S.posterColor){
      const st=[S.posterStyle, S.posterColor&&(S.posterColor+" 분위기")].filter(Boolean).join(", ");
      push("스타일은 "+st+jEuro(st)+" 해줘.",3); gap();
    }
    if(S.posterInclude.length){
      const inc=S.posterInclude.join(", ");
      push("포스터에 "+inc+jEulReul(inc)+" 남겨줘.",3); gap();
    }
    if(S.posterRatio){ push(S.posterRatio+" 형태로 만들어줘.",5); }
  }
  if(S.type==="homepage"){
    push((cusT? cusT : "(고객)")+jEulReul(cusT||"객")+" 위한",1); gap();
    push("'"+prod+"' 소개 홈페이지를 만들어줘.",2); gap();
    push("이 상품은 "+(prbT? prbT : "(문제)")+jEulReul(prbT||"제")+" 해결하는 "+kind+josa(kind,"이야.","야."),4); gap();
    if(S.homeSections.length){ push("홈페이지에는 "+S.homeSections.join(", ")+" 부분이 꼭 들어가야 해.",3); gap(); }
    if(S.homeMood){ push("전체 분위기는 "+S.homeMood+" 느낌으로 해줘.",3); gap(); }
    if(S.homeForm){ push(S.homeForm+" 구성해줘.",5); }
  }
  if(S.type==="webapp"){
    push((cusT? cusT : "(고객)")+jEulReul(cusT||"객")+" 위해,",1); gap();
    push((prbT? prbT : "(문제)")+jEulReul(prbT||"제")+" 해결하는",3); gap();
    push((S.appFeature? S.appFeature : "(기능)")+" 웹 앱을 만들어줘.",2); gap();
    if(S.appSample.trim()){ push("예시 자료야: "+S.appSample.trim()+".",4); gap(); }
    if(S.appScreen.length){
      const sc=S.appScreen.join(", ");
      push("화면에는 "+sc+jIGa(sc)+" 보여야 해.",3); gap();
    }
    if(S.appResult){ push(S.appResult+" 만들어줘.",5); }
  }
  if(S.type==="slogan"){
    push((cusT? cusT : "(고객)")+"에게",1); gap();
    push("'"+prod+"'"+jEulReul(prod)+" 알리는 한 줄 홍보 문구를 만들어줘.",2); gap();
    push("이 상품은 "+(prbT? prbT : "(문제)")+jEulReul(prbT||"제")+" 해결하는 "+kind+josa(kind,"이야.","야."),4); gap();
    const conds=[];
    if(S.sloganTone) conds.push("말투는 "+S.sloganTone+" 느낌으로");
    if(S.sloganLen) conds.push(S.sloganLen);
    if(conds.length){ push(conds.join(", ")+" 써줘.",3); gap(); }
    if(S.sloganWord.trim()){
      const w=S.sloganWord.trim();
      push("'"+w+"'"+josa(w,"이라는","라는")+" 단어를 꼭 넣어줘.",3); gap();
    }
    push("서로 다른 문구 3개를 번호를 붙여서 보여줘.",5);
  }
  return out;
}
function plainPrompt(){ return segs().map(s=>s.t).join("").replace(/\s+/g," ").trim(); }
function coloredPrompt(){
  return segs().map(s=> s.e ? '<span class="seg s'+s.e+'">'+esc(s.t)+'</span>' : esc(s.t)).join("");
}
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= 복사 ================= */
const toast=document.getElementById("toast"); let toastT;
function copy(text, msg){
  const done=()=>{ toast.textContent=msg||"복사했어요!"; toast.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),1800); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const t=document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast.textContent="복사가 안 되면 글을 길게 눌러 직접 복사해 주세요."; toast.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),2600); }
    document.body.removeChild(t);
  }
}

const modal=document.getElementById("modal"), mText=document.getElementById("mText"),
      mInput=document.getElementById("mInput"), mOk=document.getElementById("mOk"), mCancel=document.getElementById("mCancel");
let mCb=null;
function askModal(opt, cb){
  mText.textContent=opt.text;
  mOk.textContent=opt.ok||"확인"; mCancel.textContent=opt.cancel||"취소";
  if(opt.input){ mInput.style.display="block"; mInput.value=""; mInput.type=opt.password?"password":"text"; mInput.placeholder=opt.placeholder||""; }
  else mInput.style.display="none";
  mCb=cb; modal.classList.add("open");
  if(opt.input) setTimeout(()=>mInput.focus(),50);
}
function closeModal(){ modal.classList.remove("open"); mCb=null; }
mOk.onclick=()=>{ const cb=mCb, v=mInput.style.display==="none"? true : mInput.value; closeModal(); if(cb) cb(v); };
mCancel.onclick=()=> closeModal();
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
mInput.addEventListener("keydown",e=>{ if(e.key==="Enter") mOk.click(); });
function notify(msg){ toast.textContent=msg; toast.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),2000); }

    if(pin!==TEACHER_PIN){ notify("PIN이 맞지 않아요."); return; }
    const tb=document.getElementById("teacherBody");
    tb.innerHTML = TG.map(([k,label])=>'<div class="grp"><label>'+label+'</label><textarea data-k="'+k+'">'+esc(OPT[k].join("\n"))+'</textarea></div>').join("");
    teacher.classList.add("open");
  });
document.getElementById("tClose").onclick=()=> teacher.classList.remove("open");
document.getElementById("tSave").onclick=()=>{
  document.querySelectorAll("#teacherBody textarea").forEach(t=>{
    const arr=t.value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(arr.length) OPT[t.dataset.k]=arr;
  });
  saveOptions(OPT); teacher.classList.remove("open"); render();
  notify("저장했어요. 이 기기에서 계속 적용됩니다.");
};
document.getElementById("tReset").onclick=()=> askModal(
  {text:"모든 선택지를 기본값으로 되돌릴까요?", ok:"되돌리기"},
  ()=>{
    OPT=JSON.parse(JSON.stringify(DEFAULTS));
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    teacher.classList.remove("open"); render();
    notify("기본값으로 되돌렸어요.");
  });

render();
</script>
</body>
</html>
